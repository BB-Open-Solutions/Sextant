name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: nixos
    steps:
      # Plain git clone: actions/checkout is a Node action and the NixOS
      # runner deliberately carries no Node runtime.
      - name: Checkout
        run: |
          rm -rf "$GITHUB_WORKSPACE/src"
          git clone --depth 1 --branch "${GITHUB_REF_NAME:-main}" \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "$GITHUB_WORKSPACE/src"
          # --no-pager: the NixOS runner has no `less`, so git's default pager
          # would abort this command (and the whole job) with exit 128.
          git --no-pager -C "$GITHUB_WORKSPACE/src" log -1 --oneline

      - name: Format check
        run: |
          cd "$GITHUB_WORKSPACE/src"
          nix develop --command bash -c 'test -z "$(gofmt -l cmd internal)" || (gofmt -l cmd internal && exit 1)'

      - name: Vet
        run: cd "$GITHUB_WORKSPACE/src" && nix develop --command go vet ./...

      - name: Lint
        run: cd "$GITHUB_WORKSPACE/src" && nix develop --command golangci-lint run ./...

      - name: Test (race + coverage)
        run: |
          cd "$GITHUB_WORKSPACE/src"
          nix develop --command go test -race -coverprofile=coverage.out ./...
          nix develop --command bash -c '
            # The floor is measured over the logic layers. Pure-glue packages -
            # interface-only ports, the cmd/ mains and CLIs, and the slog/mount
            # wiring under platform/{logging,capability} - carry little that is
            # meaningfully unit-testable and are exercised by integration paths,
            # so counting them would understate the real coverage of domain,
            # app, adapters and the HTTP handlers.
            grep -vE "internal/ports/|/cmd/|platform/logging|platform/capability" coverage.out > coverage-logic.out
            total=$(go tool cover -func=coverage-logic.out | tail -1 | awk "{print \$3}" | tr -d "%")
            echo "logic-layer coverage: ${total}%"
            awk -v t="$total" "BEGIN { exit (t < 70) ? 1 : 0 }" || (echo "coverage below 70% floor" && exit 1)
          '

      - name: Build
        run: cd "$GITHUB_WORKSPACE/src" && nix develop --command go build -trimpath ./...

      - name: Nix package
        run: cd "$GITHUB_WORKSPACE/src" && nix build .#sextant

      - name: Agent (fmt + clippy + test)
        run: |
          cd "$GITHUB_WORKSPACE/src/agent"
          # gcc provides `cc`, which cargo needs to link crate build scripts
          # (proc-macro2, ring); the pure NixOS runner has no system compiler.
          nix shell nixpkgs#cargo nixpkgs#rustc nixpkgs#clippy nixpkgs#rustfmt nixpkgs#gcc --command bash -c '
            cargo fmt --check &&
            cargo clippy --all-targets -- -D warnings &&
            cargo test'

      - name: Agent package
        run: cd "$GITHUB_WORKSPACE/src" && nix build .#sextant-agent
