name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: nixos
    steps:
      # Plain git clone: actions/checkout is a Node action and the NixOS
      # runner deliberately carries no Node runtime.
      - name: Checkout
        run: |
          rm -rf "$GITHUB_WORKSPACE/src"
          git clone --depth 1 --branch "${GITHUB_REF_NAME:-main}" \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "$GITHUB_WORKSPACE/src"
          # --no-pager: the NixOS runner has no `less`, so git's default pager
          # would abort this command (and the whole job) with exit 128.
          git --no-pager -C "$GITHUB_WORKSPACE/src" log -1 --oneline

      - name: Format check
        run: |
          cd "$GITHUB_WORKSPACE/src"
          nix develop --command bash -c 'test -z "$(gofmt -l cmd internal)" || (gofmt -l cmd internal && exit 1)'

      - name: Vet
        run: cd "$GITHUB_WORKSPACE/src" && nix develop --command go vet ./...

      - name: Lint
        run: cd "$GITHUB_WORKSPACE/src" && nix develop --command golangci-lint run ./...

      - name: Test (race + coverage)
        run: |
          cd "$GITHUB_WORKSPACE/src"
          nix develop --command go test -race -coverprofile=coverage.out ./...
          nix develop --command bash -c '
            # The floor is measured over the logic layers. Pure-glue packages -
            # interface-only ports, the cmd/ mains and CLIs, and the slog/mount
            # wiring under platform/{logging,capability} - carry little that is
            # meaningfully unit-testable and are exercised by integration paths,
            # so counting them would understate the real coverage of domain,
            # app, adapters and the HTTP handlers.
            grep -vE "internal/ports/|/cmd/|platform/logging|platform/capability" coverage.out > coverage-logic.out
            total=$(go tool cover -func=coverage-logic.out | tail -1 | awk "{print \$3}" | tr -d "%")
            echo "logic-layer coverage: ${total}%"
            awk -v t="$total" "BEGIN { exit (t < 70) ? 1 : 0 }" || (echo "coverage below 70% floor" && exit 1)
          '

      - name: Build
        run: cd "$GITHUB_WORKSPACE/src" && nix develop --command go build -trimpath ./...

      - name: Nix package
        run: cd "$GITHUB_WORKSPACE/src" && nix build .#sextant

      # The Dockerfile is otherwise exercised only at release time, which is
      # the worst moment to discover it. `go build` above already covers the
      # compile stage, so what this adds is the RUNTIME stage: that the COPY
      # paths resolve, the pinned base digest still exists, and the entrypoint
      # is there.
      #
      # The assertion is the point, more than the build. The Dockerfile has
      # several targets and the release builds WITHOUT --target, so it relies
      # on the server stage being last - a property nobody sees when reading a
      # diff and one that silently inverts the day somebody appends a stage.
      # If that happened, a release would push the tools image, with a fleet
      # simulator inside the control plane, as production. So: build the
      # default target and prove it contains the server and nothing else.
      #
      # Built, never pushed. Publishing is the release workflow's job.
      - name: Container image (default target must be the server alone)
        run: |
          cd "$GITHUB_WORKSPACE/src"
          export PATH="/run/wrappers/bin:$PATH"
          nix shell nixpkgs#podman --command bash -c '
            set -euo pipefail
            podman build -q -t sextant-ci-check . >/dev/null
            got="$(podman run --rm --entrypoint sh sextant-ci-check -c "ls /usr/local/bin | sort | tr \"\\n\" \" \"")"
            echo "image carries: $got"
            [ "$got" = "sextant " ] || {
              echo "the default build target is not the server alone - a release would publish this as production" >&2
              exit 1
            }
            podman rmi -f sextant-ci-check >/dev/null 2>&1 || true
          '

      # Drift guard (ADR 0005): catalog.json is derived output of the example
      # overlay's flake; a hand-edited or stale copy ships a wrong settings
      # vocabulary with no signal. The script exists exactly for this hook.
      - name: Catalog drift guard
        run: cd "$GITHUB_WORKSPACE/src" && examples/overlay/regen-catalog.sh --check

      # Packaging must not break silently: the chart lints/renders and the
      # images build on every push, not just when a human happens to try.
      # The chart's DEFAULTS deliberately refuse to render (P4 fail-safe:
      # write + gateMode none needs an explicit ack), so lint/render pin a
      # valid combo - and the guards themselves are asserted to fire.
      - name: Helm lint + render
        run: |
          cd "$GITHUB_WORKSPACE/src"
          nix shell nixpkgs#kubernetes-helm --command bash -c '
            set -e
            helm lint deploy/helm --set gateMode=remote --set gateRunner.enabled=true \
              --set gateRunner.cache.keySecret=k --set gateRunner.cache.host=cache.example
            helm template deploy/helm --set gateMode=remote --set gateRunner.enabled=true \
              --set gateRunner.cache.keySecret=k --set gateRunner.cache.host=cache.example \
              --set releaseCache=true >/dev/null
            helm template deploy/helm --set gateMode=eval >/dev/null
            helm template deploy/helm --set allowUnvalidated=true >/dev/null
            if helm template deploy/helm >/dev/null 2>&1; then
              echo "P4 guard did not fire: default write+gateMode=none rendered without ack"; exit 1
            fi
            if helm template deploy/helm --set gateMode=eval --set replicaCount=2 \
              --set persistence.enabled=true >/dev/null 2>&1; then
              echo "HA guard did not fire: PVC + replicaCount>1 rendered"; exit 1
            fi
            # Every setting the server reads from the environment is looked up
            # with a SEXTANT_ prefix (config.EnvPrefix). A chart env var without
            # it is not a typo the server complains about - it is silently
            # ignored, the default applies, and the deployment looks correct
            # while doing the opposite of what the values file says. That is
            # exactly how SEXTANT_METRICS_ADDR shipped as METRICS_ADDR and left
            # /metrics on the public listener.
            #
            # HOME is the one legitimate exception: it is read by git, not by us.
            stray=$(helm template deploy/helm --set gateMode=eval \
              | grep -oE "name: [A-Z][A-Z0-9_]+" | awk "{print \$2}" | sort -u \
              | grep -vE "^(SEXTANT_|HOME$)" || true)
            if [ -n "$stray" ]; then
              echo "environment variables the server will never read (missing the SEXTANT_ prefix):" >&2
              echo "$stray" >&2
              exit 1
            fi'

      - name: Agent (fmt + clippy + test)
        run: |
          cd "$GITHUB_WORKSPACE/src/agent"
          # gcc provides `cc`, which cargo needs to link crate build scripts
          # (proc-macro2, ring); the pure NixOS runner has no system compiler.
          nix shell nixpkgs#cargo nixpkgs#rustc nixpkgs#clippy nixpkgs#rustfmt nixpkgs#gcc --command bash -c '
            cargo fmt --check &&
            cargo clippy --all-targets -- -D warnings &&
            cargo test'

      - name: Agent package
        run: cd "$GITHUB_WORKSPACE/src" && nix build .#sextant-agent

      # Recurring vulnerability gates (the one-time manual pass in the
      # security audit is not a control; a scheduled scan is). Blocking by
      # design: a new advisory in a dependency SHOULD stop the line until
      # the dependency moves.
      - name: govulncheck (Go)
        # The devshell carries govulncheck, so the scan judges the exact
        # pinned toolchain the release binaries are built with; the script
        # adds the audited exception list (see .govulncheck-exceptions).
        run: cd "$GITHUB_WORKSPACE/src" && nix develop --command scripts/vulncheck.sh

      - name: cargo audit (agent)
        run: cd "$GITHUB_WORKSPACE/src/agent" && nix shell nixpkgs#cargo nixpkgs#cargo-audit --command cargo audit
