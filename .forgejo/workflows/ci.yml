name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: nixos
    steps:
      # What this run actually is, in one line, before anything can fail. Run
      # 103 (the first pull_request event this repository ever had) failed with
      # no log to read and no step to blame; the next one will at least say
      # which ref it was handed and which runner picked it up.
      - name: Event
        run: |
          echo "event=${GITHUB_EVENT_NAME:-?} ref=${GITHUB_REF:-?} ref_name=${GITHUB_REF_NAME:-?}"
          echo "sha=${GITHUB_SHA:-?} runner=${RUNNER_NAME:-?} workspace=${GITHUB_WORKSPACE:-?}"

      # Plain git clone: actions/checkout is a Node action and the NixOS
      # runner deliberately carries no Node runtime.
      #
      # Fetch a REF, do not clone a branch. On a pull_request event
      # GITHUB_REF_NAME is not a branch that exists on the remote (Forgejo
      # reports this run's head_branch as "#24"), so `clone --branch` cannot
      # succeed and the job dies before its first real step. GITHUB_REF is the
      # thing both events agree on: refs/heads/<branch> for a push,
      # refs/pull/<n>/head for a pull request.
      #
      # The fallbacks are ordered by how specific they are, and each one says
      # so out loud: a checkout that silently lands on the wrong commit would
      # make every step below test something nobody asked about.
      - name: Checkout
        run: |
          set -eu
          rm -rf "$GITHUB_WORKSPACE/src"
          mkdir -p "$GITHUB_WORKSPACE/src"
          cd "$GITHUB_WORKSPACE/src"
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          if [ -n "${GITHUB_REF:-}" ] && git fetch -q --depth 50 origin "$GITHUB_REF"; then
            echo "checked out ${GITHUB_REF}"
          elif [ -n "${GITHUB_SHA:-}" ] && git fetch -q --depth 50 origin "$GITHUB_SHA"; then
            echo "ref ${GITHUB_REF:-} not fetchable; checked out ${GITHUB_SHA} by hash"
          else
            echo "neither ref nor sha could be fetched; falling back to the default branch" >&2
            git fetch -q --depth 50 origin HEAD
          fi
          git checkout -q --detach FETCH_HEAD
          # The commit we ended up on must be the commit this run is about.
          # Without this a fallback could quietly test the default branch and
          # report the answer as if it were about the change.
          if [ -n "${GITHUB_SHA:-}" ] && [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "checked out $(git rev-parse HEAD), expected $GITHUB_SHA" >&2
            echo "(a pull_request event points at a merge commit; that is fine, but say so)" >&2
          fi
          # --no-pager: the NixOS runner has no `less`, so git's default pager
          # would abort this command (and the whole job) with exit 128.
          git --no-pager log -1 --oneline

      # Cheap and first: a message problem should not cost a full nix build to
      # discover. Only the commits THIS push carries are checked - history
      # before the rule was enforced is left alone rather than rewritten, and
      # rewriting it once for language was already enough.
      - name: Commit messages
        run: |
          cd "$GITHUB_WORKSPACE/src"
          # The checkout is --depth 1; a range needs more than the tip.
          git fetch --deepen 50 --quiet || true
          before=""
          if [ -n "${GITHUB_EVENT_PATH:-}" ] && [ -f "$GITHUB_EVENT_PATH" ]; then
            before=$(nix develop --command jq -r '.before // ""' "$GITHUB_EVENT_PATH" 2>/dev/null || true)
          fi
          case "$before" in
            ""|0000000000000000000000000000000000000000) before="" ;;
            *) git cat-file -e "${before}^{commit}" 2>/dev/null || before="" ;;
          esac
          if [ -n "$before" ]; then
            revs=$(git rev-list "${before}..HEAD")
          else
            # First push of a branch, a force-push, or a shallow history that
            # does not reach `before`. Check the tip rather than nothing, and
            # say which case this is - a silent narrowing reads like a pass.
            echo "no usable push range; checking HEAD only" >&2
            revs=$(git rev-list -1 HEAD)
          fi
          rc=0
          for rev in $revs; do
            git --no-pager log -1 --format=%B "$rev" \
              | ./scripts/check-commit-message.sh - || rc=1
          done
          exit $rc

      - name: Format check
        run: |
          cd "$GITHUB_WORKSPACE/src"
          nix develop --command bash -c 'test -z "$(gofmt -l cmd internal)" || (gofmt -l cmd internal && exit 1)'

      - name: Vet
        run: cd "$GITHUB_WORKSPACE/src" && nix develop --command go vet ./...

      - name: Lint
        run: cd "$GITHUB_WORKSPACE/src" && nix develop --command golangci-lint run ./...

      - name: Test (race + coverage)
        run: |
          cd "$GITHUB_WORKSPACE/src"
          # Root the devshell so the collector cannot take it out from under
          # us. This is the actual cause of the twenty red commits: the
          # runner had glibc-2.42-67-bin but not glibc-2.42-67 itself, so
          # every race binary linked against a loader that was no longer
          # there. `nix develop --profile` creates a gcroot; a bare `nix
          # develop` does not, and nix says so ("you did not specify
          # '--add-root'") to nobody in particular.
          nix develop --profile "$HOME/.cache/sextant-ci-devshell" --command true

          # `go test -race` forces cgo, so every test binary is dynamically
          # linked against a glibc in the nix store. When that path is missing
          # from the runner's store the binaries build fine and then cannot be
          # exec'd, and go reports it forty times as
          #   fork/exec .../pkg.test: no such file or directory
          # which names neither the cause nor the remedy. Measured on the
          # runner 2026-08-03: interpreter present NO, disk 8% used. Say it
          # once, plainly, before spending the run on it.
          nix develop --command bash -c '
            go test -race -c -o "$TMPDIR/probe.test" ./internal/domain/rollout/
            interp=$(readelf -l "$TMPDIR/probe.test" | grep -oE "/nix/store/[^ ]*ld-linux[^]]*")
            if [ ! -e "$interp" ]; then
              echo "the race build links against $interp, which is not in this store." >&2
              echo "the runner store is incomplete - repair it:" >&2
              echo "  nix-store --realise $interp" >&2
              exit 1
            fi
            # Root the loader the binaries ACTUALLY link against, which is not
            # the same thing as rooting the devshell. Measured 2026-08-04: the
            # rooted devshell carried glibc-2.42-67 as ias8xacs..., while the
            # runner failed on 8kvxvr3p... - same version, different derivation,
            # so the profile root protected a path nothing was linking to. The
            # store path is what nix keys on, so strip everything from /lib
            # onwards to get the package root rather than the loader file.
            nix-store --realise --add-root "$HOME/.cache/sextant-ci-loader" --indirect \
              "${interp%/lib/*}" >/dev/null
          '
          nix develop --command go test -race -coverprofile=coverage.out ./...
          nix develop --command bash -c '
            # The floor is measured over the logic layers. Pure-glue packages -
            # interface-only ports, the cmd/ mains and CLIs, and the slog/mount
            # wiring under platform/{logging,capability} - carry little that is
            # meaningfully unit-testable and are exercised by integration paths,
            # so counting them would understate the real coverage of domain,
            # app, adapters and the HTTP handlers.
            # -a plus the emptiness guard, mirroring the justfile: without them
            # a profile grep decides is binary yields an empty file, and the
            # check reports "coverage below the floor" when the truth is "the
            # file was unreadable". A check that lies about why it failed sends
            # somebody looking in the wrong place.
            grep -a -vE "internal/ports/|/cmd/|platform/logging|platform/capability" coverage.out > coverage-logic.out
            if [ ! -s coverage-logic.out ]; then
              echo "coverage profile produced no logic-layer lines - refusing to report a number" >&2
              exit 1
            fi
            total=$(go tool cover -func=coverage-logic.out | tail -1 | awk "{print \$3}" | tr -d "%")
            echo "logic-layer coverage: ${total}%"
            # Raised 70 -> 80 on 2026-08-07. The margin above it is thin (about
            # ten statements), and that is the intent: a floor you cannot trip
            # is not a floor. New code that arrives untested breaks this build,
            # which is cheaper than finding out from the fleet.
            awk -v t="$total" "BEGIN { exit (t < 80) ? 1 : 0 }" || (echo "coverage below 80% floor" && exit 1)
          '

      - name: Build
        run: cd "$GITHUB_WORKSPACE/src" && nix develop --command go build -trimpath ./...

      - name: Nix package
        run: cd "$GITHUB_WORKSPACE/src" && nix build .#sextant

      # The Dockerfile is otherwise exercised only at release time, which is
      # the worst moment to discover it. `go build` above already covers the
      # compile stage, so what this adds is the RUNTIME stage: that the COPY
      # paths resolve, the pinned base digest still exists, and the entrypoint
      # is there.
      #
      # The assertion is the point, more than the build. The Dockerfile has
      # several targets and the release builds WITHOUT --target, so it relies
      # on the server stage being last - a property nobody sees when reading a
      # diff and one that silently inverts the day somebody appends a stage.
      # If that happened, a release would push the tools image, with a fleet
      # simulator inside the control plane, as production. So: build the
      # default target and prove it contains the server and nothing else.
      #
      # Built, never pushed. Publishing is the release workflow's job.
      - name: Container image (default target must be the server alone)
        run: |
          cd "$GITHUB_WORKSPACE/src"
          export PATH="/run/wrappers/bin:$PATH"
          nix shell nixpkgs#podman --command bash -c '
            set -euo pipefail
            podman build -q -t sextant-ci-check . >/dev/null
            got="$(podman run --rm --entrypoint sh sextant-ci-check -c "ls /usr/local/bin | sort | tr \"\\n\" \" \"")"
            echo "image carries: $got"
            [ "$got" = "sextant " ] || {
              echo "the default build target is not the server alone - a release would publish this as production" >&2
              exit 1
            }
            podman rmi -f sextant-ci-check >/dev/null 2>&1 || true
          '

      # Drift guard (ADR 0005): catalog.json is derived output of the example
      # overlay's flake; a hand-edited or stale copy ships a wrong settings
      # vocabulary with no signal. The script exists exactly for this hook.
      - name: Catalog drift guard
        run: cd "$GITHUB_WORKSPACE/src" && examples/overlay/regen-catalog.sh --check

      # Same shape of drift, other generated file: app.css is built from the
      # Tailwind sources and committed because the binary embeds it. A class
      # added to a template without `just css` ships markup whose styles are
      # simply absent - the page looks wrong rather than broken, so nothing
      # fails and nobody is told. An edit window shipped invisible that way on
      # 2026-08-13.
      - name: Stylesheet drift guard
        run: cd "$GITHUB_WORKSPACE/src" && nix develop --command just css-check

      # Packaging must not break silently: the chart lints/renders and the
      # images build on every push, not just when a human happens to try.
      # The chart's DEFAULTS deliberately refuse to render (P4 fail-safe:
      # write + gateMode none needs an explicit ack), so lint/render pin a
      # valid combo - and the guards themselves are asserted to fire.
      - name: Helm lint + render
        run: |
          cd "$GITHUB_WORKSPACE/src"
          nix shell nixpkgs#kubernetes-helm --command bash -c '
            set -e
            helm lint deploy/helm --set gateMode=remote --set gateRunner.enabled=true \
              --set gateRunner.cache.keySecret=k --set gateRunner.cache.host=cache.example
            helm template deploy/helm --set gateMode=remote --set gateRunner.enabled=true \
              --set gateRunner.cache.keySecret=k --set gateRunner.cache.host=cache.example \
              --set releaseCache=true >/dev/null
            helm template deploy/helm --set gateMode=eval >/dev/null
            helm template deploy/helm --set allowUnvalidated=true >/dev/null
            if helm template deploy/helm >/dev/null 2>&1; then
              echo "P4 guard did not fire: default write+gateMode=none rendered without ack"; exit 1
            fi
            if helm template deploy/helm --set gateMode=eval --set replicaCount=2 \
              --set persistence.enabled=true >/dev/null 2>&1; then
              echo "HA guard did not fire: PVC + replicaCount>1 rendered"; exit 1
            fi
            # Backup guards. A half-configured backup is worse than none: it
            # fills a bucket, moves the metrics, and cannot restore. Both
            # halves are asserted to refuse.
            if helm template deploy/helm --set gateMode=eval \
              --set cnpg.backup.enabled=true >/dev/null 2>&1; then
              echo "backup guard did not fire: enabled without destinationPath rendered"; exit 1
            fi
            if helm template deploy/helm --set gateMode=eval \
              --set cnpg.backup.enabled=true --set cnpg.backup.destinationPath=s3://b/x/ >/dev/null 2>&1; then
              echo "backup guard did not fire: enabled without secretName rendered"; exit 1
            fi
            # And a complete backup config must render BOTH objects. WAL
            # archiving with no base backup is the failure this pairing
            # exists to prevent (forgejo, 2026-06-01).
            back=$(helm template deploy/helm --set gateMode=eval \
              --set cnpg.backup.enabled=true \
              --set cnpg.backup.destinationPath=s3://b/x/ \
              --set cnpg.backup.secretName=s)
            echo "$back" | grep -q "barmanObjectStore" || { echo "backup enabled but no barmanObjectStore"; exit 1; }
            echo "$back" | grep -q "kind: ScheduledBackup" || { echo "barmanObjectStore without a ScheduledBackup: WAL with no base is not recoverable"; exit 1; }
            # Every setting the server reads from the environment is looked up
            # with a SEXTANT_ prefix (config.EnvPrefix). A chart env var without
            # it is not a typo the server complains about - it is silently
            # ignored, the default applies, and the deployment looks correct
            # while doing the opposite of what the values file says. That is
            # exactly how SEXTANT_METRICS_ADDR shipped as METRICS_ADDR and left
            # /metrics on the public listener.
            #
            # HOME is the one legitimate exception: it is read by git, not by us.
            stray=$(helm template deploy/helm --set gateMode=eval \
              | grep -oE "name: [A-Z][A-Z0-9_]+" | awk "{print \$2}" | sort -u \
              | grep -vE "^(SEXTANT_|HOME$)" || true)
            if [ -n "$stray" ]; then
              echo "environment variables the server will never read (missing the SEXTANT_ prefix):" >&2
              echo "$stray" >&2
              exit 1
            fi'

      - name: Agent (fmt + clippy + test)
        run: |
          cd "$GITHUB_WORKSPACE/src/agent"
          # gcc provides `cc`, which cargo needs to link crate build scripts
          # (proc-macro2, ring); the pure NixOS runner has no system compiler.
          nix shell nixpkgs#cargo nixpkgs#rustc nixpkgs#clippy nixpkgs#rustfmt nixpkgs#gcc --command bash -c '
            cargo fmt --check &&
            cargo clippy --all-targets -- -D warnings &&
            cargo test'

      - name: Agent package
        run: cd "$GITHUB_WORKSPACE/src" && nix build .#sextant-agent

      # Recurring vulnerability gates (the one-time manual pass in the
      # security audit is not a control; a scheduled scan is). Blocking by
      # design: a new advisory in a dependency SHOULD stop the line until
      # the dependency moves.
      - name: govulncheck (Go)
        # The devshell carries govulncheck, so the scan judges the exact
        # pinned toolchain the release binaries are built with; the script
        # adds the audited exception list (see .govulncheck-exceptions).
        run: cd "$GITHUB_WORKSPACE/src" && nix develop --command scripts/vulncheck.sh

      - name: cargo audit (agent)
        run: cd "$GITHUB_WORKSPACE/src/agent" && nix shell nixpkgs#cargo nixpkgs#cargo-audit --command cargo audit
