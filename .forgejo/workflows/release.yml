# Release: a version tag (v0.58.0) builds and pushes every image, so no
# release ever reaches the registry from a developer laptop again. The tag is
# the single lever; flux picks versions up from the platform repo as before.
#
# Requires one repository secret: REGISTRY_TOKEN - a Forgejo access token
# (package:write) for a machine account, set under the repo's
# Settings -> Actions -> Secrets. The workflow refuses to run without it
# rather than pushing anonymously.
name: release
on:
  push:
    tags:
      - "v*"

jobs:
  images:
    runs-on: nixos
    # The registry lives on BB Open's forgejo and so do its credentials. This
    # workflow must therefore only run there.
    #
    # Measured 2026-08-10, and it is why this guard exists rather than being
    # tidy: a runner was registered against Codeberg, the mirror pushed the
    # whole tag history, and Forgejo Actions started this workflow once per
    # historical tag - dozens of runs, every one of them failing on a missing
    # REGISTRY_TOKEN, on the forge we present as the public project. A
    # newcomer's first impression would have been a wall of red.
    #
    # Guarding on the server rather than on the secret is deliberate: absent
    # secrets fail late and loudly, and "loudly" is the part that was the
    # problem.
    if: github.server_url == 'https://forgejo.bb-open.com'
    steps:
      - name: Checkout tag
        run: |
          rm -rf "$GITHUB_WORKSPACE/src"
          git clone --depth 1 --branch "$GITHUB_REF_NAME" \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "$GITHUB_WORKSPACE/src"
          git --no-pager -C "$GITHUB_WORKSPACE/src" log -1 --oneline

      - name: Build and push images
        run: |
          cd "$GITHUB_WORKSPACE/src"
          if [ -z "${REGISTRY_TOKEN}" ]; then
            echo "REGISTRY_TOKEN secret is not configured; refusing to release" >&2
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          REGISTRY="forgejo.bb-open.com"
          # Rootless podman needs the setuid newuidmap/newgidmap to map the
          # forgejo-runner user's /etc/subuid range into the build's user
          # namespace. On NixOS those live in /run/wrappers/bin, which the
          # bare runner job's PATH does not carry - without it podman falls
          # back to a single-uid mapping and image unpacking dies on
          # "lchown: invalid argument".
          export PATH="/run/wrappers/bin:$PATH"
          nix shell nixpkgs#podman --command bash -c "
            set -euo pipefail
            printf '%s' \"\$REGISTRY_TOKEN\" | podman login -u release-bot --password-stdin $REGISTRY
            for spec in 'sextant:Dockerfile' 'sextant-gate:Dockerfile.gate-runner' 'sextant-docs:Dockerfile.docs'; do
              name=\${spec%%:*}; file=\${spec#*:}
              img=$REGISTRY/bb-open/\$name:$VERSION
              echo \"== building \$img\"
              # --build-arg VERSION is what puts the release into the binary: the
              # Dockerfile declares ARG VERSION=dev and hands it to -ldflags
              # -X main.version. Without it every image ever built reported
              # version="dev", in sextant_build_info and, now that the console
              # shows it, on the page too. Measured on 0.88.0, which shipped
              # with this line still missing.
              podman build --build-arg VERSION=$VERSION -t \"\$img\" -f \"\$file\" .
              podman push \"\$img\"
            done
            # The tools image (fleetsim + sxctl) is a separate target on the
            # same Dockerfile. It exists so the CONSOLE image does not carry a
            # fake-device generator; the demo instance's simulator sidecar
            # pulls this tag. Built every release because the demo tracks the
            # release, not because production needs it.
            tools=$REGISTRY/bb-open/sextant:$VERSION-tools
            echo \"== building \$tools\"
            podman build --build-arg VERSION=$VERSION --target tools -t \"\$tools\" -f Dockerfile .
            podman push \"\$tools\"
          "
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}

      # An SBOM per released image, attached to the release. A government
      # buyer asks "what is in this thing" and the honest answer is a
      # machine-readable list, not a promise. Generated from the pushed image
      # rather than the source tree, so it describes what actually ships -
      # base layer included.
      # They are published next to the images they describe, as an OCI artifact
      # under a derived tag, using the same push credential the images do.
      # Attaching them to the git release would have needed a second token with
      # release scope; a registry this one can already write to needs none, and
      # every credential that is never created is one that never leaks and never
      # has to be rotated. The OCI referrers API would be the tidier linkage,
      # but this registry answers 404 to it (measured, 2026-07-30, against both
      # a real and a bogus digest while manifest-by-digest returned 200), so a
      # predictable tag is the mechanism that actually exists.
      - name: SBOM
        run: |
          cd "$GITHUB_WORKSPACE/src"
          if [ -z "${REGISTRY_TOKEN}" ]; then
            echo "REGISTRY_TOKEN secret is not configured; cannot publish SBOMs" >&2
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          # Set here rather than inherited: every `run:` block is its own shell,
          # so a variable from the build step above is empty by the time this
          # one starts. It used to be, and syft was silently handed a ref with
          # no host in it.
          REGISTRY="forgejo.bb-open.com"
          mkdir -p sbom
          nix shell nixpkgs#syft nixpkgs#oras --command bash -c "
            set -euo pipefail
            printf '%s' \"\$REGISTRY_TOKEN\" | oras login -u release-bot --password-stdin $REGISTRY
            for name in sextant sextant-gate sextant-docs sextant:tools; do
              tag=$VERSION
              case \$name in sextant:tools) name=sextant; tag=$VERSION-tools;; esac
              img=$REGISTRY/bb-open/\$name:\$tag
              out=sbom/\$name-\$tag.spdx.json
              echo \"== sbom for \$img\"
              syft \"\$img\" -o spdx-json=\"\$out\"
              oras push \"\$img-sbom\" \
                --artifact-type application/spdx+json \
                --annotation \"org.opencontainers.image.version=$VERSION\" \
                \"\$out:application/spdx+json\"
            done
          "
          ls -l sbom/
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}

      # The chart version must match the tag: the release IS the chart+images
      # at one version, and a drifting Chart.yaml is exactly the appVersion
      # confusion the deploy mechanics memory warns about.
      - name: Chart version guard
        run: |
          cd "$GITHUB_WORKSPACE/src"
          VERSION="${GITHUB_REF_NAME#v}"
          grep -q "^version: $VERSION\$" deploy/helm/Chart.yaml || {
            echo "Chart.yaml version does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          }

      # The marketplace mirror (bb-open/sextant-charts) carries this chart in
      # the layout the Proxy platform expects. It is generated, so it can only
      # stay true if a release writes it - a copy somebody remembers to update
      # by hand is the copy a customer installs six weeks stale.
      #
      # This does NOT fail the release when the token is missing. The images
      # are the release; the mirror is a shop window. But it says so loudly,
      # because a mirror that silently stopped tracking is worse than none.
      - name: Marketplace mirror
        run: |
          cd "$GITHUB_WORKSPACE/src"
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "${MIRROR_TOKEN:-}" ]; then
            echo "::warning::MIRROR_TOKEN is not set, so bb-open/sextant-charts still offers the PREVIOUS version." >&2
            echo "run this by hand to catch it up:" >&2
            echo "  ./deploy/marketplace/sync.sh <checkout> && git -C <checkout> tag -a sextant-$VERSION" >&2
            exit 0
          fi
          # metadata.yaml carries the listing version and sync.sh refuses when
          # it disagrees with the chart. Bump it here rather than asking a
          # human to remember two files at release time.
          sed -i "s/^version: .*/version: $VERSION/" deploy/marketplace/metadata.yaml
          rm -rf /tmp/mirror
          git clone -q "https://release-bot:${MIRROR_TOKEN}@forgejo.bb-open.com/bb-open/sextant-charts.git" /tmp/mirror
          ./deploy/marketplace/sync.sh /tmp/mirror
          cd /tmp/mirror
          git config user.name "release-bot"
          git config user.email "release-bot@sextant"
          git add -A apps
          if git diff --cached --quiet; then
            echo "mirror already matches $VERSION; nothing to push"
          else
            git commit -q -m "sextant $VERSION, generated from DAWO-Sextant deploy/helm"
            git push -q origin main
          fi
          # The tag is what the marketplace resolves, so it is pushed even when
          # the tree happened not to change (a chart-only version bump).
          git tag -a "sextant-$VERSION" -m "sextant $VERSION" || true
          git push -q origin "sextant-$VERSION" || echo "tag sextant-$VERSION already exists on the mirror"
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
