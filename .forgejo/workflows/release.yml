# Release: a version tag (v0.58.0) builds and pushes every image, so no
# release ever reaches the registry from a developer laptop again. The tag is
# the single lever; flux picks versions up from the platform repo as before.
#
# Requires one repository secret: REGISTRY_TOKEN - a Forgejo access token
# (package:write) for a machine account, set under the repo's
# Settings -> Actions -> Secrets. The workflow refuses to run without it
# rather than pushing anonymously.
name: release
on:
  push:
    tags:
      - "v*"

jobs:
  images:
    runs-on: nixos
    steps:
      - name: Checkout tag
        run: |
          rm -rf "$GITHUB_WORKSPACE/src"
          git clone --depth 1 --branch "$GITHUB_REF_NAME" \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "$GITHUB_WORKSPACE/src"
          git --no-pager -C "$GITHUB_WORKSPACE/src" log -1 --oneline

      - name: Build and push images
        run: |
          cd "$GITHUB_WORKSPACE/src"
          if [ -z "${REGISTRY_TOKEN}" ]; then
            echo "REGISTRY_TOKEN secret is not configured; refusing to release" >&2
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          REGISTRY="forgejo.bb-open.com"
          # Rootless podman needs the setuid newuidmap/newgidmap to map the
          # forgejo-runner user's /etc/subuid range into the build's user
          # namespace. On NixOS those live in /run/wrappers/bin, which the
          # bare runner job's PATH does not carry - without it podman falls
          # back to a single-uid mapping and image unpacking dies on
          # "lchown: invalid argument".
          export PATH="/run/wrappers/bin:$PATH"
          nix shell nixpkgs#podman --command bash -c "
            set -euo pipefail
            podman login -u release-bot -p \"\$REGISTRY_TOKEN\" $REGISTRY
            for spec in 'sextant:Dockerfile' 'sextant-gate:Dockerfile.gate-runner' 'sextant-docs:Dockerfile.docs'; do
              name=\${spec%%:*}; file=\${spec#*:}
              img=$REGISTRY/bb-open/\$name:$VERSION
              echo \"== building \$img\"
              podman build -t \"\$img\" -f \"\$file\" .
              podman push \"\$img\"
            done
            # The tools image (fleetsim + sxctl) is a separate target on the
            # same Dockerfile. It exists so the CONSOLE image does not carry a
            # fake-device generator; the demo instance's simulator sidecar
            # pulls this tag. Built every release because the demo tracks the
            # release, not because production needs it.
            tools=$REGISTRY/bb-open/sextant:$VERSION-tools
            echo \"== building \$tools\"
            podman build --target tools -t \"\$tools\" -f Dockerfile .
            podman push \"\$tools\"
          "
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}

      # An SBOM per released image, attached to the release. A government
      # buyer asks "what is in this thing" and the honest answer is a
      # machine-readable list, not a promise. Generated from the pushed image
      # rather than the source tree, so it describes what actually ships -
      # base layer included.
      - name: SBOM
        run: |
          cd "$GITHUB_WORKSPACE/src"
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p sbom
          nix shell nixpkgs#syft --command bash -c '
            set -euo pipefail
            for name in sextant sextant-gate sextant-docs; do
              syft "'"$REGISTRY"'/bb-open/$name:'"$VERSION"'"                 -o spdx-json="sbom/$name-'"$VERSION"'.spdx.json"
            done
          '
          ls -l sbom/
          # Publishing these as release assets needs a token with release
          # scope, which this runner does not have (it carries REGISTRY_TOKEN
          # only) and no action is wired up here - the workflow is deliberately
          # bare nix+podman. Generating them every release is still worth it on
          # its own: it FAILS the release if an image cannot be read, and it
          # produces the artifact the moment somebody wires up a token. Wiring
          # that up is tracked separately.

      # The chart version must match the tag: the release IS the chart+images
      # at one version, and a drifting Chart.yaml is exactly the appVersion
      # confusion the deploy mechanics memory warns about.
      - name: Chart version guard
        run: |
          cd "$GITHUB_WORKSPACE/src"
          VERSION="${GITHUB_REF_NAME#v}"
          grep -q "^version: $VERSION\$" deploy/helm/Chart.yaml || {
            echo "Chart.yaml version does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          }
