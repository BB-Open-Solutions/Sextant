# Sextant chart defaults. Secrets never live in values: the release reads
# an existing Secret (secretName) with SEXTANT_* keys.
image:
  repository: forgejo.bb-open.com/bb-open/sextant
  # Empty by default: the deployment template falls back to
  # `.Chart.AppVersion` (`| default .Chart.AppVersion`), so a fresh install
  # with no override tracks the chart it came from instead of whatever tag
  # was last hand-pinned here. A running release may still be moved onto a
  # specific tag out of band (e.g. a live `kubectl patch` on the Deployment's
  # image field, ADR-documented) without that becoming the new checked-in
  # default and going stale again.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

replicaCount: 1

# Existing Secret with SEXTANT_API_TOKEN, SEXTANT_CHECKIN_TOKEN,
# SEXTANT_SESSION_KEY, SEXTANT_OIDC_CLIENT_SECRET; optionally
# SEXTANT_LDAP_BIND_PASSWORD, and SEXTANT_PG_DSN when cnpg.enabled=false
# (external Postgres).
#
# SEXTANT_SECRET_KEY (also optional) seals the few secrets Sextant holds at
# rest, and that includes the LUKS RECOVERY KEYS escrowed from devices - the
# break-glass path for a locked laptop. ROTATING IT: put the new key FIRST and
# KEEP the old one, comma-separated:
#     SEXTANT_SECRET_KEY=<new-base64-32B>,<old-base64-32B>
# New values seal under the new key; everything already stored keeps opening
# under the old one, because each sealed value names the key that sealed it.
# Removing a key makes every value sealed under it unreadable, so keep it until
# nothing needs it. If you do lose it, the error says which key id is missing
# rather than pretending the data is corrupt.
secretName: sextant-v2

write: true
# Validation gate. remote (recommended for any real deploy) delegates to the
# gate-runner; eval runs in-pod nix (the console image ships none, so eval is
# effectively dev-only); none commits WITHOUT validation. A write-enabled
# console with gateMode: none refuses to start unless allowUnvalidated: true
# is set explicitly - a bad fleet.json otherwise reaches devices.
gateMode: none # none | eval | remote
# allowUnvalidated acknowledges a deliberate no-gate write deploy (a demo /
# dev cell). Never set this on a cell that manages real devices.
allowUnvalidated: false

# gate-runner: nix-capable validation gate for gateMode=remote. The console
# image ships no nix; when enabled the runner evaluates the overlay generator
# out of process. Deploy it (enabled) and verify /healthz before flipping the
# console to gateMode=remote (remote is fail-closed: writes reject if the
# runner is down).
gateRunner:
  enabled: false
  image:
    repository: forgejo.bb-open.com/bb-open/sextant-gate
    # Empty by default: falls back to .Chart.AppVersion, same as image.tag
    # above.
    tag: ""
    pullPolicy: IfNotPresent
  hostVariants: "" # comma-separated suffixes the generator emits, e.g. ",-sb"
  # Max host toplevels forced per nix process. The gate evaluates a large host
  # set in batches of this size so peak memory is bounded by the batch, not the
  # fleet: size it to the runner's memory limit below (a batch that does not fit
  # OOM-fails its own change instead of the node). Empty = the binary default.
  chunkSize: ""
  # Concurrent eval batches. Wall-clock for a big validation divides by it;
  # peak memory multiplies by it: workers x per-batch memory must fit the
  # resources.limits below. Empty = 1 (sequential).
  evalWorkers: ""
  # Release cache (build-before-promote): the runner realises a ring's release
  # and serves it - signed - under /cache, so devices substitute instead of
  # compiling. Enabled by naming the Secret that holds the nix signing secret
  # key (key: "key"; generate with `nix key generate-secret --key-name <org>-1`).
  # The console enables the build step separately via releaseCache below.
  cache:
    keySecret: ""
    # Optional dedicated host for the cache (Ingress + TLS via certManager);
    # empty serves /cache only inside the cluster.
    host: ""
    # Node-disk cap for the ephemeral cache volume (emptyDir). The cache is
    # derived state: a pod restart clears it and builds republish on demand.
    sizeLimit: 20Gi
    # persistent: keep the release cache across pod restarts on a PVC.
    # Rebuilding a full system image takes hours, and every console release
    # restarts the gate pod - for a single-node/on-prem install a PVC is the
    # difference between an instant wave and a two-hour await-build. Central
    # durable storage (S3) remains the enterprise tier.
    persistent: false
    storageClass: ""
  # The nix store is baked into the image (chowned to the runtime uid); a
  # volume over /nix would hide it, so only the overlay clone is persisted.
  # First eval per pod re-fetches nixpkgs to the ephemeral layer.
  persistence:
    enabled: true
    storageClass: ""
    dataSize: 2Gi
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { cpu: "2", memory: 4Gi }

# Git remote as the source of truth (M1): when url is set, the init
# container clones it instead of self-seeding, and the server runs with
# --git-remote=origin (sync loop + HA push). netrcSecret must contain a
# `netrc` key with credentials for the remote host.
gitRemote:
  url: ""
  branch: main
  netrcSecret: ""
logFormat: json

oidc:
  issuer: ""
  clientId: ""
  groupsClaim: ""
  scopes: ""
editorGroups: ""
ownerGroups: ""
viewerGroups: ""

# Organisation presentation defaults; per-user preferences override.
orgName: "" # the organisation's display name (the scope tree's root); empty = "Organisation"
# Build-before-promote (requires gateMode remote + gateRunner.cache configured):
# a ring's release is built into the runner's signed cache before its branch
# moves. Devices must list the cache as a substituter (overlay config).
releaseCache: false
defaultLocale: "" # en|nl; empty = en
defaultTimezone: "" # IANA name; empty = UTC
upstreamRepo: "" # core image repo the upstream watcher polls; empty disables it

# Optional LDAP directory browse (group pickers). The app runs fully
# without it: empty url leaves the surface off and access bindings stay
# free-text. Bind password goes in the secret as SEXTANT_LDAP_BIND_PASSWORD.
ldap:
  url: ""
  bindDn: ""
  baseDn: ""
  groupFilter: ""
  nameAttr: ""

# CloudNativePG single-instance cluster for the observed plane. The
# operator must be installed cluster-wide. DSN comes from the generated
# <name>-app secret.
cnpg:
  enabled: true
  name: sextant-pg
  instances: 1
  storage: 2Gi
  storageClass: longhorn

persistence:
  enabled: true
  size: 1Gi
  storageClass: longhorn

ingress:
  enabled: true
  className: cilium
  host: console.bb-open.com
  tls: true
certManager:
  enabled: true
  issuerName: letsencrypt-dns01
  issuerKind: ClusterIssuer

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { cpu: "1", memory: 512Mi }

# The simulated fleet (demo instances only): fleetsim as a sidecar deployment
# against this release's own console. Keep off anywhere real devices report.
simulator:
  enabled: false
  interval: 30s
  # fleetsim lives in the TOOLS image, not the console image: it can invent
  # device state from nothing but the shared check-in token, so the control
  # plane does not carry it. Empty values default to the console repository
  # with a "-tools" suffix on the tag, which is what
  # `podman build --target tools -t <repo>:<tag>-tools .` produces.
  image:
    repository: ""
    tag: ""

# Metrics. separatePort moves /metrics onto its own container port, off the
# listener the ingress publishes. Leave it on: the endpoint discloses the exact
# build, the route inventory and the per-route traffic volume, and a public
# console would otherwise serve all of that to anyone who asks. It carries no
# fleet data, but a version number is the first thing somebody matches against
# a vulnerability list.
#
# Nothing needs the public path. Prometheus scrapes inside the cluster, and the
# console's own /status page reads the build identity server-side.
#
# Turning it off puts /metrics back on the main listener, which is right for a
# local run with no ingress in front and no second port to scrape.
metrics:
  separatePort: true
  port: 9090
