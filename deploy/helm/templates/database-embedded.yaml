{{- if eq (include "sextant.dbMode" .) "embedded" }}
{{- /* One Postgres in the release namespace. It is here for a demo and for a
       cell that has no operator to lean on, and it is deliberately plain:
       one instance, one volume, no replication, no archive, no backup. The
       cnpg.backup comment in values.yaml about the LUKS escrow is the reason
       this is not the default.

       The password is generated once and then read back on every upgrade
       (lookup), so a `helm upgrade` never rotates it under a running
       database. With `helm template` lookup sees nothing and renders a fresh
       one; that is a render, not an install. */}}
{{- $name := printf "%s-pg" .Release.Name }}
{{- $password := randAlphaNum 32 }}
{{- with (lookup "v1" "Secret" .Release.Namespace $name) }}
  {{- with index .data "password" }}
    {{- $password = . | b64dec }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: { app: {{ $name }} }
  annotations:
    # Survives `helm uninstall`, like the StatefulSet's volume does, so a
    # reinstall opens the same data. Removing the cell for good means
    # deleting the Secret and the PVC by hand, which is the right amount of
    # friction for the only copy of the recovery-key escrow.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  username: sextant
  password: {{ $password | quote }}
  # Same shape as the CloudNativePG `<name>-app` secret, so the console reads
  # the two modes identically. sslmode=disable: the connection never leaves
  # the namespace and the network policy restricts 5432 to the console pod.
  uri: {{ printf "postgresql://sextant:%s@%s:5432/sextant?sslmode=disable" $password $name | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: { app: {{ $name }} }
spec:
  selector: { app: {{ $name }} }
  ports:
    - { port: 5432, targetPort: postgres, name: postgres }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels: { app: {{ $name }} }
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels: { app: {{ $name }} }
  template:
    metadata:
      labels: { app: {{ $name }} }
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      # Pod Security Standard restricted. The official image runs as any
      # uid once its data directory is writable; 70 is the postgres user it
      # ships with, so file ownership matches what pg_ctl expects.
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: "{{ .Values.database.embedded.image.repository }}:{{ .Values.database.embedded.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - { name: POSTGRES_USER, value: sextant }
            - { name: POSTGRES_DB, value: sextant }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ $name }}, key: password }
            # A subdirectory, so the volume's lost+found does not make initdb
            # refuse a "non-empty" directory.
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports:
            - { containerPort: 5432, name: postgres }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "sextant", "-d", "sextant", "-h", "127.0.0.1"] }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "sextant", "-d", "sextant", "-h", "127.0.0.1"] }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources: {{- toYaml .Values.database.embedded.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: run, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
        {{- if .Values.database.embedded.ephemeral }}
        - { name: data, emptyDir: {} }
        {{- end }}
  {{- if not .Values.database.embedded.ephemeral }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels: { app: {{ $name }} }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.database.embedded.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.database.embedded.storage }}
  {{- end }}
{{- end }}
