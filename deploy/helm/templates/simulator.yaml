{{- if and .Values.simulator.enabled (not .Values.simulator.sidecar) }}
# The simulated fleet (demo instances only): fleetsim drives N fake agents
# against this release's own service, following the overlay's rings/<group>
# branches like comin would. Never enable this next to real devices - the demo
# namespace tracks its own overlay branch.
#
# It runs from the TOOLS image, not the console image. fleetsim can manufacture
# device state from nothing but the shared check-in token, so it no longer
# ships in the control-plane image; simulator.image (default: the console
# repository with a -tools tag suffix) points at the target that carries it.
# Build it with: podman build --target tools -t <repo>:<tag>-tools .
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-fleetsim
  labels: { app: {{ .Release.Name }}-fleetsim }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: {{ .Release.Name }}-fleetsim }
  template:
    metadata:
      labels: { app: {{ .Release.Name }}-fleetsim }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: fleetsim
          image: "{{ .Values.simulator.image.repository | default .Values.image.repository }}:{{ .Values.simulator.image.tag | default (printf "%s-tools" (.Values.image.tag | default .Chart.AppVersion)) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          # Clone the fleet document first: fleetsim needs the tags+groups it
          # simulates, from the same branch this console serves.
          args:
            - |
              set -eu
              git clone -q --depth 1 --branch {{ .Values.gitRemote.branch }} {{ .Values.gitRemote.url }} /tmp/overlay
              exec fleetsim -url http://{{ .Release.Name }}:80 \
                -token "$SEXTANT_CHECKIN_TOKEN" \
                -repo {{ .Values.gitRemote.url }} \
                -fleet /tmp/overlay/fleet.json \
                -interval {{ .Values.simulator.interval | default "30s" }} \
                {{- with .Values.simulator.station }}
                {{- if .tag }}
                -station {{ .tag }} \
                -station-pool {{ .pool | default 3 }} \
                -station-fail {{ .failPercent | default 10 }} \
                -station-secureboot={{ .secureBoot | default true }}
                {{- end }}
                {{- end }}
          envFrom:
            - secretRef: { name: {{ .Values.secretName }} }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: false
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
