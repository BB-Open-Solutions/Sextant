apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels: { app: {{ .Release.Name }} }
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate # single writer on the overlay PVC
  selector:
    matchLabels: { app: {{ .Release.Name }} }
  template:
    metadata:
      labels: { app: {{ .Release.Name }} }
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # Self-seed: an empty data volume gets a git overlay repo with a
        # minimal v3 fleet document, so the console starts standalone. An
        # existing repo is left untouched.
        - name: seed-overlay
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              {{- if .Values.gitRemote.url }}
              export HOME=/data
              {{- if .Values.gitRemote.netrcSecret }}
              install -m 0600 /netrc-secret/netrc /data/.netrc
              {{- end }}
              if [ ! -d /data/overlay/.git ]; then
                # Fresh volume: clone the source of truth.
                git clone --branch {{ .Values.gitRemote.branch }} \
                  {{ .Values.gitRemote.url }} /data/overlay
              else
                # Existing volume: ensure it points at the remote and is in
                # sync (idempotent - safe on every restart).
                git -C /data/overlay remote get-url origin >/dev/null 2>&1 \
                  || git -C /data/overlay remote add origin {{ .Values.gitRemote.url }}
                git -C /data/overlay remote set-url origin {{ .Values.gitRemote.url }}
                git -C /data/overlay fetch -q origin {{ .Values.gitRemote.branch }}
                git -C /data/overlay branch --set-upstream-to=origin/{{ .Values.gitRemote.branch }} {{ .Values.gitRemote.branch }} 2>/dev/null || true
              fi
              {{- else }}
              if [ ! -d /data/overlay/.git ]; then
                mkdir -p /data/overlay
                cd /data/overlay
                git init -q -b main
                cat > fleet.json <<'EOF'
              {
                "version": 3,
                "org": {"settings": {"desktop": "plasma"}},
                "groups": {"pilot": {}},
                "devices": {}
              }
              EOF
                git add fleet.json
                git -c user.name=sextant -c user.email=seed@sextant commit -qm "seed overlay"
              fi
              {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /data }
            {{- if and .Values.gitRemote.url .Values.gitRemote.netrcSecret }}
            - { name: netrc, mountPath: /netrc-secret, readOnly: true }
            {{- end }}
      containers:
        - name: sextant
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --addr=0.0.0.0:8080
            - --repo=/data/overlay
            - --state-dir=/data/state
            {{- if .Values.write }}
            - --write
            {{- end }}
            - --gate={{ .Values.gateMode }}
            {{- if eq .Values.gateMode "remote" }}
            - --gate-url=http://{{ .Release.Name }}-gate:8090
            {{- end }}
            {{- if .Values.gitRemote.url }}
            - --git-remote=origin
            {{- end }}
            - --log-format={{ .Values.logFormat }}
            - --secure-cookies
            {{- with .Values.oidc.issuer }}
            - --oidc-issuer={{ . }}
            {{- end }}
            {{- with .Values.oidc.clientId }}
            - --oidc-client-id={{ . }}
            {{- end }}
            {{- if .Values.oidc.issuer }}
            - --oidc-redirect-url=https://{{ .Values.ingress.host }}/callback
            {{- end }}
            {{- with .Values.oidc.groupsClaim }}
            - --oidc-groups-claim={{ . }}
            {{- end }}
            {{- with .Values.oidc.scopes }}
            - --oidc-scopes={{ . }}
            {{- end }}
            {{- with .Values.viewerGroups }}
            - --viewer-groups={{ . }}
            {{- end }}
            {{- with .Values.editorGroups }}
            - --editor-groups={{ . }}
            {{- end }}
            {{- with .Values.ownerGroups }}
            - --owner-groups={{ . }}
            {{- end }}
          envFrom:
            - secretRef: { name: {{ .Values.secretName }} }
          env:
            {{- if .Values.gitRemote.url }}
            # git reads /data/.netrc (written by the init container) for
            # the overlay remote's credentials.
            - { name: HOME, value: /data }
            {{- end }}
            {{- if .Values.cnpg.enabled }}
            - name: SEXTANT_PG_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cnpg.name }}-app
                  key: uri
            {{- end }}
            {{- with .Values.defaultLocale }}
            - { name: SEXTANT_DEFAULT_LOCALE, value: {{ . | quote }} }
            {{- end }}
            {{- with .Values.defaultTimezone }}
            - { name: SEXTANT_DEFAULT_TIMEZONE, value: {{ . | quote }} }
            {{- end }}
            {{- with .Values.ldap.url }}
            - { name: SEXTANT_LDAP_URL, value: {{ . | quote }} }
            {{- end }}
            {{- with .Values.ldap.bindDn }}
            - { name: SEXTANT_LDAP_BIND_DN, value: {{ . | quote }} }
            {{- end }}
            {{- with .Values.ldap.baseDn }}
            - { name: SEXTANT_LDAP_BASE_DN, value: {{ . | quote }} }
            {{- end }}
            {{- with .Values.ldap.groupFilter }}
            - { name: SEXTANT_LDAP_GROUP_FILTER, value: {{ . | quote }} }
            {{- end }}
            {{- with .Values.ldap.nameAttr }}
            - { name: SEXTANT_LDAP_NAME_ATTR, value: {{ . | quote }} }
            {{- end }}
          ports:
            - { containerPort: 8080, name: http }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 36 # 3 minutes for dependency dial-in
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 20
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if and .Values.gitRemote.url .Values.gitRemote.netrcSecret }}
        - name: netrc
          secret:
            secretName: {{ .Values.gitRemote.netrcSecret }}
        {{- end }}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
