{{/* Passwordless demo guards. Each of these combinations renders something
     that looks like it works and is not what anybody meant, so the chart
     refuses instead of shipping it. */}}
{{- if .Values.devAuth.enabled }}
  {{- if .Values.ingress.enabled }}
    {{- fail "devAuth.enabled binds the console to loopback, so an Ingress in front of it can only serve 503s. Set ingress.enabled=false and reach the demo with kubectl port-forward." }}
  {{- end }}
  {{- if .Values.oidc.issuer }}
    {{- fail "devAuth.enabled and oidc.issuer are mutually exclusive: the server refuses to start with both, and the pod would crash-loop with the reason three levels deep in a log." }}
  {{- end }}
  {{- if and .Values.simulator.enabled (not .Values.simulator.sidecar) }}
    {{- fail "devAuth.enabled needs simulator.sidecar=true: a loopback console is not reachable through its Service, so a separate simulator would post into a void and the demo would show a fleet that never checks in." }}
  {{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels: { app: {{ .Release.Name }} }
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if gt (int .Values.replicaCount) 1 }}
  {{- if .Values.persistence.enabled }}
  {{- fail "replicaCount > 1 needs persistence.enabled: false - the overlay is a per-replica git clone (RWO PVC cannot be shared across replicas). Each replica clones the remote and syncs; the committing workers run under database leader election." }}
  {{- end }}
  strategy:
    type: RollingUpdate # HA: each replica has its own overlay clone (emptyDir)
  {{- else }}
  strategy:
    type: Recreate # single replica, PVC-backed overlay clone
  {{- end }}
  selector:
    matchLabels: { app: {{ .Release.Name }} }
  template:
    metadata:
      labels: { app: {{ .Release.Name }} }
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # Self-seed: an empty data volume gets a git overlay repo with a
        # minimal v3 fleet document, so the console starts standalone. An
        # existing repo is left untouched.
        - name: seed-overlay
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              {{- if .Values.gitRemote.url }}
              export HOME=/data
              {{- if .Values.gitRemote.netrcSecret }}
              install -m 0600 /netrc-secret/netrc /data/.netrc
              {{- end }}
              if [ ! -d /data/overlay/.git ]; then
                # Fresh volume: clone the source of truth.
                git clone --branch {{ .Values.gitRemote.branch }} \
                  {{ .Values.gitRemote.url }} /data/overlay
              else
                # Existing volume: ensure it points at the remote and is in
                # sync (idempotent - safe on every restart).
                git -C /data/overlay remote get-url origin >/dev/null 2>&1 \
                  || git -C /data/overlay remote add origin {{ .Values.gitRemote.url }}
                git -C /data/overlay remote set-url origin {{ .Values.gitRemote.url }}
                git -C /data/overlay fetch -q origin {{ .Values.gitRemote.branch }}
                git -C /data/overlay branch --set-upstream-to=origin/{{ .Values.gitRemote.branch }} {{ .Values.gitRemote.branch }} 2>/dev/null || true
              fi
              {{- else }}
              if [ ! -d /data/overlay/.git ]; then
                mkdir -p /data/overlay
                cd /data/overlay
                git init -q -b main
                cat > fleet.json <<'EOF'
              {
                "version": 3,
                "org": {"settings": {"desktop": "plasma"}},
                "groups": {"pilot": {}},
                "devices": {}
              }
              EOF
                git add fleet.json
                git -c user.name=sextant -c user.email=seed@sextant commit -qm "seed overlay"
              fi
              {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /data }
            {{- if and .Values.gitRemote.url .Values.gitRemote.netrcSecret }}
            - { name: netrc, mountPath: /netrc-secret, readOnly: true }
            {{- end }}
      containers:
        - name: sextant
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- if .Values.devAuth.enabled }}
            # Loopback is the whole safety property of devAuth: nothing on the
            # network can reach a console that hands out owner sessions.
            - --addr=127.0.0.1:8080
            - --dev-auth
            {{- else }}
            - --addr=0.0.0.0:8080
            {{- end }}
            - --repo=/data/overlay
            - --state-dir=/data/state
            {{- if .Values.write }}
            - --write
            {{- end }}
            - --gate={{ .Values.gateMode }}
            {{- if eq .Values.gateMode "remote" }}
            - --gate-url=http://{{ .Release.Name }}-gate:8090
            {{- end }}
            {{- if and .Values.write (eq .Values.gateMode "none") (not .Values.allowUnvalidated) }}
            {{- fail "gateMode: none with write: true commits unvalidated config to devices. Use gateMode: remote (recommended) or eval, or set allowUnvalidated: true for a deliberate dev/demo cell." }}
            {{- end }}
            {{- if .Values.gitRemote.url }}
            - --git-remote=origin
            {{- end }}
            - --log-format={{ .Values.logFormat }}
            - --secure-cookies
            - --trust-proxy
            {{- with .Values.oidc.issuer }}
            - --oidc-issuer={{ . }}
            {{- end }}
            {{- with .Values.oidc.clientId }}
            - --oidc-client-id={{ . }}
            {{- end }}
            {{- if .Values.oidc.issuer }}
            - --oidc-redirect-url=https://{{ .Values.ingress.host }}/callback
            {{- end }}
            {{- with .Values.oidc.groupsClaim }}
            - --oidc-groups-claim={{ . }}
            {{- end }}
            {{- with .Values.oidc.scopes }}
            - --oidc-scopes={{ . }}
            {{- end }}
            {{- with .Values.viewerGroups }}
            - --viewer-groups={{ . }}
            {{- end }}
            {{- with .Values.editorGroups }}
            - --editor-groups={{ . }}
            {{- end }}
            {{- with .Values.ownerGroups }}
            - --owner-groups={{ . }}
            {{- end }}
          envFrom:
            - secretRef: { name: {{ .Values.secretName }} }
          env:
            {{- if .Values.gitRemote.url }}
            # git reads /data/.netrc (written by the init container) for
            # the overlay remote's credentials.
            - { name: HOME, value: /data }
            {{- end }}
            {{- if .Values.cnpg.enabled }}
            - name: SEXTANT_PG_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cnpg.name }}-app
                  key: uri
            {{- end }}
            # The gate-runner's bearer secret is stored unprefixed (GATE_TOKEN,
            # the runner's own env name); the console reads SEXTANT_-prefixed
            # env only, so map it explicitly. Without this the console sends no
            # Authorization header and every direct gate call is refused (401)
            # while CR-staged edits appear to work (their build step is a no-op
            # in remote mode) - an easy misconfiguration to miss.
            - name: SEXTANT_GATE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: GATE_TOKEN
                  optional: true
            {{- with .Values.orgName }}
            - { name: SEXTANT_ORG_NAME, value: {{ . | quote }} }
            {{- end }}
            {{- if .Values.releaseCache }}
            - { name: SEXTANT_RELEASE_CACHE, value: "true" }
            {{- end }}
            {{- if .Values.allowUnvalidated }}
            # Acknowledge the unvalidated write path via env (not a flag) so an
            # image predating the flag ignores it rather than failing to parse.
            - { name: SEXTANT_ALLOW_UNVALIDATED, value: "true" }
            {{- end }}
            {{- with .Values.defaultLocale }}
            - { name: SEXTANT_DEFAULT_LOCALE, value: {{ . | quote }} }
            {{- end }}
            {{- with .Values.upstreamRepo }}
            # Core image repository the upstream watcher polls: a new HEAD
            # stages a core-update change request (delivery-process q5/§9).
            - { name: SEXTANT_UPSTREAM_REPO, value: {{ . | quote }} }
            {{- end }}
            {{- with .Values.defaultTimezone }}
            - { name: SEXTANT_DEFAULT_TIMEZONE, value: {{ . | quote }} }
            {{- end }}
            {{- with .Values.ldap.url }}
            - { name: SEXTANT_LDAP_URL, value: {{ . | quote }} }
            {{- end }}
            {{- with .Values.ldap.bindDn }}
            - { name: SEXTANT_LDAP_BIND_DN, value: {{ . | quote }} }
            {{- end }}
            {{- with .Values.ldap.baseDn }}
            - { name: SEXTANT_LDAP_BASE_DN, value: {{ . | quote }} }
            {{- end }}
            {{- with .Values.ldap.groupFilter }}
            - { name: SEXTANT_LDAP_GROUP_FILTER, value: {{ . | quote }} }
            {{- end }}
            {{- with .Values.ldap.nameAttr }}
            - { name: SEXTANT_LDAP_NAME_ATTR, value: {{ . | quote }} }
            {{- end }}
            {{- if .Values.ldap.caSecret }}
            # Go reads certificates from every path in SSL_CERT_DIR, so the
            # private CA is added to the system store rather than replacing
            # it. Keeps ldaps:// verification strict without a bundle-merge
            # initContainer, which readOnlyRootFilesystem would fight.
            - { name: SSL_CERT_DIR, value: "/etc/ssl/certs:/ldap-ca" }
            {{- end }}
            {{- if .Values.metrics.separatePort }}
            # Moves /metrics off the listener the ingress publishes. The
            # Service does not expose this port, so it is reachable from
            # inside the cluster only - which is where the scraper is.
            - { name: SEXTANT_METRICS_ADDR, value: "0.0.0.0:{{ .Values.metrics.port }}" }
            {{- end }}
          ports:
            - { containerPort: 8080, name: http }
            {{- if .Values.metrics.separatePort }}
            - { containerPort: {{ .Values.metrics.port }}, name: metrics }
            {{- end }}
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 36 # 3 minutes for dependency dial-in
          {{- if .Values.devAuth.enabled }}
          # kubelet probes dial the POD IP, and a loopback listener does not
          # answer there. Probing from inside the container is the same
          # question asked from a place that can hear the answer.
          readinessProbe:
            exec: { command: ["wget", "-q", "-O-", "http://127.0.0.1:8080/readyz"] }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["wget", "-q", "-O-", "http://127.0.0.1:8080/healthz"] }
            initialDelaySeconds: 5
            periodSeconds: 20
          {{- else }}
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 20
          {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
            {{- if .Values.ldap.caSecret }}
            - { name: ldap-ca, mountPath: /ldap-ca, readOnly: true }
            {{- end }}
        {{- if and .Values.simulator.enabled .Values.simulator.sidecar }}
        # The simulator runs here rather than beside the console because a
        # loopback-bound console has no address on the network. Same image and
        # same arguments as the standalone deployment; only the URL differs,
        # and that difference is the entire reason this container exists.
        - name: fleetsim
          image: "{{ .Values.simulator.image.repository | default .Values.image.repository }}:{{ .Values.simulator.image.tag | default (printf "%s-tools" (.Values.image.tag | default .Chart.AppVersion)) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              git clone -q --depth 1 --branch {{ .Values.gitRemote.branch }} {{ .Values.gitRemote.url }} /tmp/overlay
              exec fleetsim -url http://127.0.0.1:8080 \
                -token "$SEXTANT_CHECKIN_TOKEN" \
                -repo {{ .Values.gitRemote.url }} \
                -fleet /tmp/overlay/fleet.json \
                -interval {{ .Values.simulator.interval | default "30s" }} \
                {{- with .Values.simulator.station }}
                {{- if .tag }}
                -station {{ .tag }} \
                -station-pool {{ .pool | default 3 }} \
                -station-fail {{ .failPercent | default 10 }} \
                -station-secureboot={{ .secureBoot | default true }}
                {{- end }}
                {{- end }}
          envFrom:
            - secretRef: { name: {{ .Values.secretName }} }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
        {{- end }}

      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.ldap.caSecret }}
        - name: ldap-ca
          secret:
            secretName: {{ .Values.ldap.caSecret }}
            items:
              - { key: ca.crt, path: ca.crt }
        {{- end }}
        {{- if and .Values.gitRemote.url .Values.gitRemote.netrcSecret }}
        - name: netrc
          secret:
            secretName: {{ .Values.gitRemote.netrcSecret }}
        {{- end }}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
