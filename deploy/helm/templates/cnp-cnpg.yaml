{{- if and (eq .Values.networkPolicy.engine "cilium") .Values.cnpg.enabled }}
# Platform pattern (see allow-odoo-to-cnpg): once any egress policy selects
# the pod, Cilium denies all other egress - so this policy carries the FULL
# egress set: DNS, the CNPG cluster, and 443 for the OIDC provider.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-{{ .Release.Name }}-egress
spec:
  endpointSelector:
    matchLabels:
      app: {{ .Release.Name }}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: {{ .Values.cnpg.name }}
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # OIDC issuer (id.bb-open.com) and other HTTPS egress (git remotes).
    - toEntities:
        - world
        - cluster
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    {{- if .Values.gateRunner.enabled }}
    # The gate-runner (in-cluster) on 8090 for remote validation.
    - toEndpoints:
        - matchLabels:
            app: {{ .Release.Name }}-gate
      toPorts:
        - ports:
            - port: "8090"
              protocol: TCP
    {{- end }}
{{- end }}
{{- if and (eq .Values.networkPolicy.engine "cilium") .Values.gateRunner.enabled }}
---
# gate-runner egress: DNS + HTTPS to the overlay git remote, cache.nixos.org
# and the flake inputs it evaluates. Once selected, Cilium denies all other
# egress, so this is the full set.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-{{ .Release.Name }}-gate-egress
spec:
  endpointSelector:
    matchLabels:
      app: {{ .Release.Name }}-gate
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - world
        - cluster
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # The console, to verify a substituting device's credential before serving
    # it from the cache. In-cluster and plain HTTP on purpose: it never leaves
    # the pod network, and terminating TLS between two pods in the same
    # namespace buys nothing a network policy does not already give.
    - toEndpoints:
        - matchLabels:
            app: {{ .Release.Name }}
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
{{- end }}
