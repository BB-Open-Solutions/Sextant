apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  selector: { app: {{ .Release.Name }} }
  ports:
    - { port: 80, targetPort: http, name: http }
{{- if .Values.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  {{- if .Values.certManager.enabled }}
  annotations:
    cert-manager.io/{{ if eq .Values.certManager.issuerKind "ClusterIssuer" }}cluster-issuer{{ else }}issuer{{ end }}: {{ .Values.certManager.issuerName }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port: { name: http }
  {{- if .Values.ingress.tls }}
  tls:
    - hosts: [{{ .Values.ingress.host }}]
      secretName: {{ .Release.Name }}-tls
  {{- end }}
{{- end }}
{{- if .Values.cnpg.enabled }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.cnpg.name }}
spec:
  instances: {{ .Values.cnpg.instances }}
  # Kyverno require-resource-limits (Enforce) rejects pods without limits.
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }
  storage:
    size: {{ .Values.cnpg.storage }}
    {{- with .Values.cnpg.storageClass }}
    storageClass: {{ . }}
    {{- end }}
{{- if .Values.cnpg.backup.enabled }}
  {{- $b := .Values.cnpg.backup }}
  {{- if not $b.destinationPath }}
    {{- fail "cnpg.backup.enabled requires cnpg.backup.destinationPath (an s3:// prefix)" }}
  {{- end }}
  {{- if not $b.secretName }}
    {{- fail "cnpg.backup.enabled requires cnpg.backup.secretName holding ACCESS_KEY_ID and SECRET_ACCESS_KEY" }}
  {{- end }}
  {{- /* Archiving on a volume too small to survive its own failure. Postgres
         switches a 16 MiB segment every archive_timeout whether or not
         anything happened; the moment the archive cannot be written they pile
         up locally, and CNPG stops the instance rather than fill the disk.
         On 2026-08-13 that was a 2Gi volume, about ten hours of headroom, and
         the ten hours ran out overnight. Refusing to render is the only place
         this can be said before it happens. */}}
  {{- $gib := include "sextant.gib" .Values.cnpg.storage | float64 }}
  {{- if and (lt $gib 8.0) (not .Values.cnpg.acknowledgeSmallVolume) }}
    {{- fail (printf "cnpg.storage is %s with backup.enabled: WAL archiving fills roughly 4.6 GiB a day, so a failed archive stops this database within hours (production, 2026-08-13). Use 8Gi or more, or set cnpg.acknowledgeSmallVolume=true for a deliberate demo cell." .Values.cnpg.storage) }}
  {{- end }}
  backup:
    retentionPolicy: {{ $b.retention | quote }}
    barmanObjectStore:
      destinationPath: {{ $b.destinationPath | quote }}
      {{- with $b.endpointURL }}
      endpointURL: {{ . | quote }}
      {{- end }}
      s3Credentials:
        accessKeyId:
          name: {{ $b.secretName }}
          key: {{ $b.accessKeyIdKey }}
        secretAccessKey:
          name: {{ $b.secretName }}
          key: {{ $b.secretAccessKeyKey }}
      wal:
        compression: gzip
      data:
        compression: gzip
{{- end }}
{{- if .Values.cnpg.backup.enabled }}
---
# A ScheduledBackup is NOT optional alongside barmanObjectStore, which is why
# the chart renders both or neither rather than offering two switches.
#
# WAL archiving without a base backup is not a backup. It looks like one -
# the bucket fills, the metrics move - but there is nothing to replay the WAL
# ONTO, so recovery is impossible. This exact gap sat unnoticed on the
# forgejo cluster in this same platform until 2026-06-01, with
# firstRecoverabilityPoint empty the whole time.
#
# immediate: true closes the window on apply instead of at the first
# scheduled run, because the interval between "backup enabled" and "first
# base backup" is precisely the interval in which everybody believes they
# are covered.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ .Values.cnpg.name }}-scheduled
spec:
  # CNPG cron takes SIX fields (sec min hour dom month dow), not five.
  schedule: {{ .Values.cnpg.backup.schedule | quote }}
  immediate: true
  backupOwnerReference: self
  cluster:
    name: {{ .Values.cnpg.name }}
  method: barmanObjectStore
{{- end }}
{{- end }}
