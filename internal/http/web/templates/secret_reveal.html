{{define "content"}}
<section class="mx-auto flex max-w-xl flex-col gap-6">
  <div class="flex flex-col gap-2">
    <h1 class="mb-0 flex items-center gap-2"><span class="material-symbols-outlined text-mint-deep">vpn_key</span>{{.L.T "secret.title"}}</h1>
    <p class="mb-0 text-body-md text-text-tertiary">{{.L.T "secret.for"}} <span class="font-mono text-ink">{{.Tag}}</span> · {{.Kind}}</p>
  </div>

  <div class="rounded-lg border-2 border-status-warn/40 bg-canvas p-6 shadow-sm">
    <div class="mb-2 flex items-center gap-2 text-label-md font-bold text-status-warn"><span class="material-symbols-outlined msz-16">warning</span>{{.L.T "secret.oneshot"}}</div>
    <p class="mb-3 text-body-sm text-text-tertiary">{{.L.T "secret.oneshot_desc"}}</p>
    <div class="flex items-center justify-between gap-2 rounded bg-surface-code px-3 py-3">
      <code class="select-all break-all font-mono text-code-md text-canvas" data-copy>{{.Value}}</code>
      <button type="button" data-copy-btn title="{{.L.T "common.copy"}}" class="shrink-0 text-surface-dim hover:text-canvas" aria-label="{{$.L.T "common.copy"}}"><span class="material-symbols-outlined msz-18">content_copy</span></button>
    </div>
    <p class="mt-2 text-label-xs-caps uppercase text-text-tertiary">{{.L.T "secret.audited"}}</p>
  </div>

  <div class="flex items-center gap-3 self-start">
    <a href="{{.Back}}" class="btn !border-border-hairline !bg-transparent !text-ink"><span class="material-symbols-outlined msz-18">arrow_back</span>{{.L.T "common.back"}}</a>
    <a href="/enroll" class="btn quiet !text-ink"><span class="material-symbols-outlined msz-18">lan</span>{{.L.T "enroll.title"}}</a>
  </div>
</section>
{{end}}
