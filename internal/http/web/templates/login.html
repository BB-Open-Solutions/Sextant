{{define "login"}}<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - Sextant</title>
  <link rel="stylesheet" href="/static/fonts.css">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="bg-surface text-on-surface antialiased">
<div class="flex min-h-screen items-center justify-center p-6">
  <div class="w-full max-w-sm rounded-xl border border-border-hairline bg-canvas p-8 shadow-sm">
    <div class="mb-6 flex items-center gap-sm">
      <span class="flex h-9 w-9 items-center justify-center rounded-lg bg-ink">
        <svg viewBox="0 0 24 24" class="h-6 w-6" aria-hidden="true">
          <path d="M18.5 5.5 L13.5 13.5 L10.5 10.5 Z" fill="#ffffff"/>
          <path d="M5.5 18.5 L13.5 13.5 L10.5 10.5 Z" fill="#00d4a4"/>
          <circle cx="12" cy="12" r="1.5" fill="#0a0a0a"/>
        </svg>
      </span>
      <div>
        <div class="text-headline-sm font-bold text-ink leading-none">Sextant</div>
        <div class="text-body-sm font-normal normal-case tracking-normal text-text-tertiary">Fleet control plane</div>
      </div>
    </div>
    <p class="muted mb-6">Declarative fleet control-plane for NixOS.</p>
    {{if .SSO}}
    <a href="/login/start" class="btn w-full justify-center">
      <span class="material-symbols-outlined">login</span>Sign in with SSO
    </a>
    {{else}}
    <div class="error">No identity provider configured.</div>
    {{end}}
  </div>
</div>
</body>
</html>{{end}}
