# Local development stack: Sextant + Postgres. Secrets come from .env
# (never committed); see .env.example.
services:
  sextant:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    env_file: .env
    environment:
      SEXTANT_ADDR: 0.0.0.0:8080
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sextant
      POSTGRES_USER: sextant
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets:
      - pg_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sextant -d sextant"]
      interval: 5s
      timeout: 3s
      retries: 10

secrets:
  pg_password:
    file: ./.pg_password

volumes:
  pgdata:
