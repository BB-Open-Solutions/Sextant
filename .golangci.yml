version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - prealloc
    - revive
    - unconvert
    - unparam
    - whitespace
  settings:
    revive:
      rules:
        - name: exported
          disabled: false
    gosec:
      # These gosec rules were reviewed in a dedicated security audit
      # (govulncheck + standalone gosec, 2026-07) and the flagged sites are
      # contextually safe; the real findings were fixed. Excluded from the CI
      # lint so the noise does not block merges - the standalone gosec pass
      # stays the security gate for these classes.
      excludes:
        - G101 # "secret"/"token" i18n label strings, not real credentials
        - G118 # notify goroutine intentionally outlives the request context
        - G124 # cookie clears; the one genuinely missing Secure/HttpOnly was fixed
        - G204 # exec uses fixed/validated argv (no shell); git/nix adapters
        - G301 # dir perms on server-private, non-secret control-plane paths
        - G304 # file reads confined by safePath or server-controlled paths
        - G306 # file perms (a git working tree is conventionally 0644)
        - G402 # LDAP InsecureSkipVerify is an opt-in labs-only flag, off by default
        - G704 # sxctl CLI calls its own operator-configured console, not SSRF
        - G705 # change diff is served text/plain with X-Content-Type-Options nosniff
        - G710 # redirect targets a single cleaned, same-origin path segment
    misspell:
      # catalog.go embeds the Dutch (nl) translation table alongside the
      # English one: "Instelling" (Setting) and "proces" (process) are
      # correct Dutch, not misspelled English. "mosquitto" is the MQTT
      # broker's actual package name, not the insect.
      ignore-rules:
        - Instelling
        - proces
        - productie
        - mosquitto
  exclusions:
    rules:
      # Test helpers may ignore some errors for brevity.
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - bodyclose

formatters:
  enable:
    - gofmt
    - goimports
