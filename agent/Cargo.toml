[package]
name = "sextant-agent"
version = "0.1.0"
edition = "2021"
description = "Sextant device agent: reports deployed revision and hardware facts to the fleet console"
license = "EUPL-1.2"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
